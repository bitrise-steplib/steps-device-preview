format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  # The include-style Unified CI setup (`include: - repository: steps-check`) can only resolve
  # repositories in this repository's own GitHub organisation, so it has to wait until the Step
  # moves under bitrise-steplib. Until then this is the legacy shared check.
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  # Local debugging only. Needs a real build context, so run it from a Bitrise build or
  # set BITRISE_BUILD_URL and BITRISE_BUILD_API_TOKEN in .bitrise.secrets.yml.
  sample:
    envs:
    - APP_PATH: $BITRISE_APP_DIR_PATH.zip
    steps:
    - path::./:
        inputs:
        - app_path: $APP_PATH
        - verbose: "true"

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: { }
